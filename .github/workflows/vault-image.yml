name: Vault image

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
    paths:
      - Dockerfile
      - docker-entrypoint.sh
      - vault-server.hcl.tmpl
      - ci/vault_image_contract.py
      - ci/test_vault_image_contract.py
      - .github/workflows/lint-test.yml
      - .github/workflows/release.yml
      - .github/workflows/vault-image.yml
  workflow_run:
    workflows:
      - Terraform CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vault-image-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    name: Image contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require image and module release separation
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          test "${PR_TITLE#*\[skip-release\]}" != "$PR_TITLE"

  build:
    name: Build and scan / ${{ matrix.architecture.platform }}
    if: github.event_name == 'pull_request'
    needs: contract
    runs-on: ${{ matrix.architecture.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - runner: ubuntu-24.04
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    env:
      LOCAL_IMAGE: libops-ci/vault-server:${{ github.sha }}-${{ matrix.architecture.suffix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3

      - name: Build native image without publisher credentials
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: .
          file: Dockerfile
          load: true
          platforms: ${{ matrix.architecture.platform }}
          provenance: false
          push: false
          tags: ${{ env.LOCAL_IMAGE }}

      - name: Verify Vault version and runtime identity
        run: python3 ci/vault_image_contract.py "$LOCAL_IMAGE"

      - name: Scan native image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library

  authorize:
    name: Authorize post-CI image commit
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.path == '.github/workflows/lint-test.yml'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      image-tag: ${{ steps.image.outputs.tag }}
    env:
      PUBLISH_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out exact CI commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Require successful CI for the current main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$PUBLISH_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$PUBLISH_SHA"
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main" = "$PUBLISH_SHA"

      - name: Resolve managed image tag
        id: image
        run: echo 'tag=main' >> "$GITHUB_OUTPUT"

  publish:
    name: Publish Vault / GHCR and GAR
    if: needs.authorize.result == 'success'
    needs: authorize
    uses: libops/.github/.github/workflows/build-push.yaml@main
    with:
      image: vault-server
      ref: ${{ github.event.workflow_run.head_sha }}
      tag: ${{ needs.authorize.outputs.image-tag }}
      expected-main-sha: ${{ github.event.workflow_run.head_sha }}
      additional-gar-registry: us-docker.pkg.dev/libops-images/public
      scan: true
      sign: true
    secrets:
      GCLOUD_OIDC_POOL: ${{ secrets.GCLOUD_OIDC_POOL }}
      GSA: ${{ secrets.GSA }}
    permissions:
      contents: read
      packages: write
      id-token: write

  required:
    name: Vault image / required
    if: always()
    needs:
      - contract
      - build
      - authorize
      - publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require pull request validation
        if: github.event_name == 'pull_request'
        env:
          AUTHORIZE_RESULT: ${{ needs.authorize.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          CONTRACT_RESULT: ${{ needs.contract.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          set -euo pipefail
          test "$CONTRACT_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$AUTHORIZE_RESULT" = skipped
          test "$PUBLISH_RESULT" = skipped

      - name: Require authorized publication
        if: github.event_name == 'workflow_run' && needs.authorize.result == 'success'
        env:
          AUTHORIZE_RESULT: ${{ needs.authorize.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          CONTRACT_RESULT: ${{ needs.contract.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          set -euo pipefail
          test "$CONTRACT_RESULT" = skipped
          test "$BUILD_RESULT" = skipped
          test "$AUTHORIZE_RESULT" = success
          test "$PUBLISH_RESULT" = success

      - name: Require ineligible workflow runs to remain unpublished
        if: github.event_name == 'workflow_run' && needs.authorize.result == 'skipped'
        env:
          AUTHORIZE_RESULT: ${{ needs.authorize.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          CONTRACT_RESULT: ${{ needs.contract.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          set -euo pipefail
          test "$CONTRACT_RESULT" = skipped
          test "$BUILD_RESULT" = skipped
          test "$AUTHORIZE_RESULT" = skipped
          test "$PUBLISH_RESULT" = skipped

      - name: Reject failed publication authorization
        if: >-
          github.event_name == 'workflow_run' &&
          needs.authorize.result != 'success' &&
          needs.authorize.result != 'skipped'
        run: exit 1
